<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planificator concedii</title>
<style>
  :root{
    --ink:#1B2A41; --paper:#F7F5F0; --card:#FFFFFF; --line:#E2DDD3;
    --sage:#3F7D5C; --sageBg:#E5F0E9; --amber:#B8860B; --amberBg:#F6ECD4;
    --rust:#9E4A3B; --rustBg:#F3E1DD; --muted:#7A7568;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Segoe UI',system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  .head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;
    gap:16px;border-bottom:2px solid var(--ink);padding-bottom:16px}
  .eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
  h1{font-family:Georgia,serif;font-size:34px;margin:4px 0 0;font-weight:700}
  h2{font-family:Georgia,serif;font-size:20px;margin:0 0 14px}
  .roles{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .roles button{padding:10px 16px;border:none;cursor:pointer;font-size:14px;font-weight:600;
    background:transparent;color:var(--ink);display:flex;align-items:center;gap:6px}
  .roles button.on{background:var(--ink);color:var(--paper)}
  .badge{background:var(--amberBg);color:var(--amber);border-radius:20px;padding:1px 7px;font-size:12px}
  .roles button.on .badge{background:var(--amber);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:24px}
  label span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
    background:var(--paper);color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .primary{margin-top:16px;padding:11px 20px;background:var(--ink);color:var(--paper);border:none;
    border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
  .nav button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);
    color:var(--ink);cursor:pointer;font-size:14px;font-weight:600;margin-left:8px}
  .nav button.today{background:var(--ink);color:var(--paper)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0;
    text-transform:uppercase;letter-spacing:1px}
  .cell{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:5px;background:var(--card)}
  .cell.today{border-color:var(--ink)}
  .dnum{font-size:12px;color:var(--muted)}
  .pill{font-size:10px;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .legend{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
  .swatch{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}
  .req{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;flex-wrap:wrap;margin-bottom:10px}
  .status{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
  .mini{padding:6px 12px;border-radius:8px;border:1px solid;cursor:pointer;font-size:13px;font-weight:600;
    color:#fff;margin-left:6px}
  .foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
  .banner{border-radius:10px;padding:12px 14px;font-size:13px;margin-top:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <div class="eyebrow">Registru concedii</div>
      <h1>Planificator concedii</h1>
    </div>
    <div class="roles">
      <button id="tabEmp" class="on" onclick="setRole('employee')">Angajat</button>
      <button id="tabMgr" onclick="setRole('manager')">Manager <span id="pcount" class="badge" style="display:none"></span></button>
    </div>
  </div>

  <div id="conn" class="banner"></div>

  <section id="formCard" class="card">
    <h2>Cerere de concediu</h2>
    <div class="grid">
      <label><span>Nume angajat</span><input id="fName" placeholder="ex. Andreea Pop" /></label>
      <label><span>De la</span><input id="fStart" type="date" /></label>
      <label><span>Până la</span><input id="fEnd" type="date" /></label>
    </div>
    <div style="margin-top:12px">
      <label><span>Motiv (opțional)</span><input id="fReason" placeholder="ex. Concediu de odihnă" /></label>
    </div>
    <div id="dur" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
    <div id="err" style="margin-top:10px;color:var(--rust);font-size:13px"></div>
    <button class="primary" onclick="submitReq()">Trimite cererea</button>
  </section>

  <section class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 id="calTitle" style="margin:0"></h2>
      <div class="nav">
        <button onclick="shiftMonth(-1)">‹</button>
        <button class="today" onclick="goToday()">Azi</button>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--sageBg);border-left:3px solid var(--sage)"></span>Aprobat</span>
      <span><span class="swatch" style="background:var(--amberBg);border-left:3px solid var(--amber)"></span>În așteptare</span>
    </div>
  </section>

  <section class="card">
    <h2 id="listTitle">Toate cererile</h2>
    <div id="list"></div>
  </section>

  <div class="foot">Datele se sincronizează live pentru toți cei care deschid această aplicație.</div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ── Configurare Supabase (valorile tale) ──
const SUPABASE_URL = "https://heviandwservmtzxfrnt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldmlhbmR3c2Vydm10enhmcm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODQ4MTksImV4cCI6MjEwNDM2MDgxOX0.CEy6M_3iOwWYHamGuJNuH5qOQaEMK9KQyZsjGwKvais";

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const MONTHS=["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
const DAYS=["Lun","Mar","Mie","Joi","Vin","Sâm","Dum"];
const STATUS={
  pending:{label:"În așteptare",fg:"var(--amber)",bg:"var(--amberBg)"},
  approved:{label:"Aprobat",fg:"var(--sage)",bg:"var(--sageBg)"},
  rejected:{label:"Respins",fg:"var(--rust)",bg:"var(--rustBg)"}
};

let requests=[], role="employee", view=new Date();

const fmt=d=>d.toISOString().slice(0,10);
const parse=s=>{const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd)};
const roLabel=s=>{const d=parse(s);return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5)+1;
function eachDay(a,b){const out=[];let d=parse(a),e=parse(b);
  while(d<=e){out.push(fmt(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)}return out}

function banner(msg,kind){
  const b=document.getElementById("conn");
  b.style.display="block";b.textContent=msg;
  const map={err:["var(--rustBg)","var(--rust)"],ok:["var(--sageBg)","var(--sage)"]};
  const[bg,fg]=map[kind]||map.err;
  b.style.background=bg;b.style.color=fg;b.style.border="1px solid "+fg;
  if(kind==="ok")setTimeout(()=>b.style.display="none",1500);
}

async function load(){
  const {data,error}=await sb.from("concedii").select("*").order("created",{ascending:false});
  if(error){banner("Eroare la citire: "+error.message,"err");return}
  requests=data||[];
  document.getElementById("conn").style.display="none";
  render();
}

// live updates
sb.channel("concedii-live")
  .on("postgres_changes",{event:"*",schema:"public",table:"concedii"},load)
  .subscribe();

window.setRole=r=>{role=r;
  document.getElementById("tabEmp").classList.toggle("on",r==="employee");
  document.getElementById("tabMgr").classList.toggle("on",r==="manager");
  document.getElementById("formCard").style.display=r==="employee"?"block":"none";
  document.getElementById("listTitle").textContent=r==="manager"?"Cereri de aprobat":"Toate cererile";
  render();
};
window.shiftMonth=n=>{view=new Date(view.getFullYear(),view.getMonth()+n,1);render()};
window.goToday=()=>{view=new Date();render()};

window.submitReq=async()=>{
  const err=document.getElementById("err");err.textContent="";
  const name=document.getElementById("fName").value.trim();
  const start=document.getElementById("fStart").value;
  const end=document.getElementById("fEnd").value;
  const reason=document.getElementById("fReason").value.trim();
  if(!name)return err.textContent="Adaugă numele angajatului.";
  if(!start||!end)return err.textContent="Alege data de început și de sfârșit.";
  if(parse(end)<parse(start))return err.textContent="Data de sfârșit e înaintea celei de început.";
  const {error}=await sb.from("concedii").insert({
    name,start_date:start,end_date:end,reason,status:"pending",created:Date.now()
  });
  if(error){err.textContent="Nu s-a putut salva: "+error.message;return}
  document.getElementById("fName").value="";document.getElementById("fStart").value="";
  document.getElementById("fEnd").value="";document.getElementById("fReason").value="";
  document.getElementById("dur").textContent="";
  banner("Cerere trimisă.","ok");
  load();
};
window.decide=async(id,status)=>{
  const {error}=await sb.from("concedii").update({status}).eq("id",id);
  if(error)banner("Eroare: "+error.message,"err");else load();
};
window.removeReq=async id=>{
  const {error}=await sb.from("concedii").delete().eq("id",id);
  if(error)banner("Eroare: "+error.message,"err");else load();
};

["fStart","fEnd"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{
  const s=document.getElementById("fStart").value,e=document.getElementById("fEnd").value;
  document.getElementById("dur").textContent=(s&&e&&parse(e)>=parse(s))?
    `Durată: ${daysBetween(s,e)} zile calendaristice`:"";
}));

function render(){
  const pending=requests.filter(r=>r.status==="pending").length;
  const pc=document.getElementById("pcount");
  if(pending>0){pc.style.display="inline-block";pc.textContent=pending}else pc.style.display="none";

  const y=view.getFullYear(),mo=view.getMonth();
  document.getElementById("calTitle").textContent=`${MONTHS[mo]} ${y}`;
  const byDay={};
  requests.forEach(r=>{if(r.status==="rejected")return;
    eachDay(r.start_date,r.end_date).forEach(d=>{(byDay[d]=byDay[d]||[]).push(r)})});
  const off=(new Date(y,mo,1).getDay()+6)%7;
  const dim=new Date(y,mo+1,0).getDate();
  const today=fmt(new Date());
  let html=DAYS.map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<off;i++)html+="<div></div>";
  for(let d=1;d<=dim;d++){
    const ds=fmt(new Date(y,mo,d));const ent=byDay[ds]||[];
    let pills=ent.slice(0,3).map(r=>{const s=STATUS[r.status];
      return `<div class="pill" title="${r.name} — ${s.label}" style="background:${s.bg};color:${s.fg};border-left:3px solid ${s.fg}">${r.name.split(" ")[0]}</div>`}).join("");
    if(ent.length>3)pills+=`<div style="font-size:10px;color:var(--muted)">+${ent.length-3}</div>`;
    html+=`<div class="cell${ds===today?" today":""}"><div class="dnum">${d}</div>${pills}</div>`;
  }
  document.getElementById("cal").innerHTML=html;

  const list=document.getElementById("list");
  if(requests.length===0){list.innerHTML=`<div style="color:var(--muted);font-size:14px;padding:8px 0">Nicio cerere încă.</div>`;return}
  list.innerHTML=requests.map(r=>{const s=STATUS[r.status];
    let actions=`<span class="status" style="color:${s.fg};background:${s.bg}">${s.label}</span>`;
    if(role==="manager"&&r.status==="pending"){
      actions+=`<button class="mini" style="background:var(--sage);border-color:var(--sage)" onclick="decide('${r.id}','approved')">Aprobă</button>`;
      actions+=`<button class="mini" style="background:var(--rust);border-color:var(--rust)" onclick="decide('${r.id}','rejected')">Respinge</button>`;
    }
    if(role==="manager")
      actions+=`<button class="mini" style="background:transparent;color:var(--muted);border-color:var(--line)" onclick="removeReq('${r.id}')">✕</button>`;
    return `<div class="req"><div><div style="font-weight:700;font-size:15px">${r.name}</div>
      <div style="font-size:13px;color:var(--muted)">${roLabel(r.start_date)} – ${roLabel(r.end_date)} · ${daysBetween(r.start_date,r.end_date)} zile${r.reason?" · "+r.reason:""}</div></div>
      <div style="display:flex;align-items:center">${actions}</div></div>`;
  }).join("");
}

render();
load();
</script>
</body>
</html>
